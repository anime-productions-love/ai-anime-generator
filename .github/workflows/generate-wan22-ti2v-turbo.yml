# Wan2.2 TI2V-5B Turbo, single/automatic chained scenes on CPU (v8).
name: Generate Wan 2.2 Turbo anime scene (v8)

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: "Auto-detect gallery image/video URLs; or continue the last Wan clip"
        type: choice
        required: true
        default: auto
        options:
          - auto
          - image
          - continue-last
          - video-url
      image:
        description: "Gallery file or commit URL, direct image/video URL; ignored for continue-last"
        type: string
        required: false
        default: "https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/diffusers/svd/rocket.png"
      prompt:
        description: "Describe the scene action, character movement, and camera movement"
        type: string
        required: true
        default: "Anime cinematic scene, subject moves naturally, camera slowly pushes in."
      negative_prompt:
        description: "Things the model should avoid"
        type: string
        required: false
        default: "frozen frame, flicker, jitter, warped face, deformed anatomy, text, watermark"
      fit_mode:
        description: "Keep full image visible, or center-crop"
        type: choice
        required: true
        default: "contain-blur"
        options:
          - "contain-blur"
          - "contain"
          - "crop"
      frames:
        description: "Number of delivered frames; backend rounds up to 4n+1"
        type: number
        required: true
        default: 17
      fps:
        description: "Video playback frames per second"
        type: number
        required: true
        default: 8
      width:
        description: "Width, a multiple of 16"
        type: number
        required: true
        default: 832
      height:
        description: "Height, a multiple of 16"
        type: number
        required: true
        default: 480
      seed:
        description: "Random seed for reproducibility"
        type: number
        required: true
        default: 42
      chain_plan:
        description: "Optional: chains/<name>.json; generate ALL segments automatically"
        type: string
        required: false
        default: ""
      chain_step:
        description: "Internal chain step (1=first segment); leave 1 to start"
        type: number
        required: false
        default: 1
      chain_previous_run:
        description: "Internal: exact preceding Wan run ID; leave empty to start"
        type: string
        required: false
        default: ""
      chain_id:
        description: "Internal: ID of first run in chain; leave empty to start"
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: wan-chain-${{ inputs.chain_id != '' && inputs.chain_id || github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libopenblas-dev ffmpeg

      - name: Prepare optional automatic scene chain plan
        if: inputs.chain_plan != ''
        env:
          CHAIN_PLAN: ${{ inputs.chain_plan }}
          CHAIN_STEP: ${{ inputs.chain_step }}
          CHAIN_PREVIOUS_RUN: ${{ inputs.chain_previous_run }}
          CHAIN_ID: ${{ inputs.chain_id }}
        run: |
          python3 scripts/wan_chain.py prepare \
            --plan-path "$CHAIN_PLAN" \
            --index "$CHAIN_STEP" \
            --previous-run "${CHAIN_PREVIOUS_RUN:-0}" \
            --chain-id "$CHAIN_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --output work/wan-chain-plan.json

      - name: Preserve chain recovery context before expensive inference
        if: inputs.chain_plan != ''
        uses: actions/upload-artifact@v4
        with:
          name: wan-chain-recovery-v1-${{ github.run_id }}
          path: work/wan-chain-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Resolve image, latest successful Wan frame, or video URL
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_FINE_GRAINED_TOKEN: ${{ secrets.GITHUB_FINE_GRAINED_TOKEN }}
          GALLERY_REPO_TOKEN: ${{ secrets.GALLERY_REPO_TOKEN }}
          GALLERY_TOKEN: ${{ secrets.GALLERY_TOKEN }}
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GALLERY_PAT: ${{ secrets.GALLERY_PAT }}
          VIDEO_REPO_TOKEN: ${{ secrets.VIDEO_REPO_TOKEN }}
          SOURCE_MODE: ${{ inputs.source_mode }}
          INPUT_URL: ${{ inputs.image }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CHAIN_PLAN: ${{ inputs.chain_plan }}
        run: |
          if [ -n "$CHAIN_PLAN" ]; then
            python3 scripts/wan_chain.py source \
              --plan work/wan-chain-plan.json \
              --output inputs/downloaded_image
          else
            python3 scripts/resolve_scene_input.py \
              --source-mode "$SOURCE_MODE" \
              --input "$INPUT_URL" \
              --workflow-file generate-wan22-ti2v-turbo.yml \
              --repository "$REPOSITORY" \
              --current-run-id "$CURRENT_RUN_ID" \
              --output inputs/downloaded_image
          fi

      - name: Restore pinned CPU backend cache
        id: cpu_cache
        uses: actions/cache@v4
        with:
          path: sd-cpp
          key: wan-cpp-linux24-cpu-290148d2e31ca6ef9757d567905776b5f3646db5-v1

      - name: Build stable-diffusion.cpp only when cache is missing
        if: steps.cpu_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/leejet/stable-diffusion.cpp.git sd-cpp
          git -C sd-cpp checkout 290148d2e31ca6ef9757d567905776b5f3646db5
          git -C sd-cpp submodule update --init --recursive
          cmake -S sd-cpp -B sd-cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSD_BUILD_EXAMPLES=ON -DSD_CUDA=OFF -DSD_VULKAN=OFF
          cmake --build sd-cpp/build --parallel 4

      - name: Restore version-pinned Wan model cache
        id: model_cache
        uses: actions/cache@v4
        with:
          path: models/wan22
          key: wan-turbo-5b-q4k-m-umt5-q3ks-vae-hf-v1

      - name: Download missing Wan weights (atomic and resumable)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/wan22
          fetch_weight() {
            local path="$1" min="$2" url="$3"
            if [[ -f "$path" ]] && (( $(stat -c '%s' "$path") >= min )); then
              echo "Reusing cached $path"
              return
            fi
            rm -f "$path"
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 30 \
              -o "$path.partial" "$url"
            if (( $(stat -c '%s' "$path.partial") < min )); then
              echo "::error::Model file too small: $path"
              exit 1
            fi
            mv "$path.partial" "$path"
          }
          fetch_weight models/wan22/Wan2_2-TI2V-5B-Turbo-Q4_K_M.gguf 500000000 \
            'https://huggingface.co/hum-ma/Wan2.2-TI2V-5B-Turbo-GGUF/resolve/main/Wan2_2-TI2V-5B-Turbo-Q4_K_M.gguf'
          fetch_weight models/wan22/umt5-xxl-encoder-Q3_K_S.gguf 300000000 \
            'https://huggingface.co/city96/umt5-xxl-encoder-gguf/resolve/main/umt5-xxl-encoder-Q3_K_S.gguf'
          fetch_weight models/wan22/Wan2.2_VAE.safetensors 300000000 \
            'https://huggingface.co/QuantStack/Wan2.2-TI2V-5B-GGUF/resolve/main/VAE/Wan2.2_VAE.safetensors'

      - name: Set up Python for scene packaging
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow for full-image framing
        run: python -m pip install --no-cache-dir 'Pillow>=10.4,<13'

      - name: Generate prompt-directed scene
        env:
          WAN_IMAGE: inputs/downloaded_image
          WAN_PROMPT: ${{ inputs.prompt }}
          WAN_NEGATIVE: ${{ inputs.negative_prompt }}
          WAN_NAME: scene-${{ github.run_id }}
          WAN_FIT: ${{ inputs.fit_mode }}
          WAN_FRAMES: ${{ inputs.frames }}
          WAN_FPS: ${{ inputs.fps }}
          WAN_WIDTH: ${{ inputs.width }}
          WAN_HEIGHT: ${{ inputs.height }}
          WAN_STEPS: 4
          WAN_SEED: ${{ inputs.seed }}
          CHAIN_PLAN: ${{ inputs.chain_plan }}
        run: |
          if [ -n "$CHAIN_PLAN" ]; then
            python3 -u scripts/wan_chain.py generate \
              --plan work/wan-chain-plan.json \
              --output-dir outputs/wan22
          else
            python -u scripts/generate_wan22.py \
              --image "$WAN_IMAGE" \
              --prompt "$WAN_PROMPT" \
              --negative-prompt "$WAN_NEGATIVE" \
              --scene-name "$WAN_NAME" \
              --fit-mode "$WAN_FIT" \
              --frames "$WAN_FRAMES" \
              --fps "$WAN_FPS" \
              --width "$WAN_WIDTH" \
              --height "$WAN_HEIGHT" \
              --steps "$WAN_STEPS" \
              --seed "$WAN_SEED" \
              --output-dir outputs/wan22
          fi

      - name: Record successful chain step and verified final-frame digest
        if: inputs.chain_plan != ''
        run: |
          python3 scripts/wan_chain.py record \
            --plan work/wan-chain-plan.json \
            --output-dir outputs/wan22

      - name: Publish complete scene artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wan22-turbo-v8-${{ github.run_id }}
          path: outputs/wan22/
          if-no-files-found: error
          retention-days: 7

      - name: Archive every Wan output permanently in private gallery
        if: success()
        env:
          VIDEO_REPO_TOKEN: ${{ secrets.VIDEO_REPO_TOKEN }}
        run: |
          python3 scripts/archive_gallery.py \
            --run-id "$GITHUB_RUN_ID" --kind wan --source outputs/wan22

      - name: Dispatch next scene or final movie after uploading artifact
        if: inputs.chain_plan != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/wan_chain.py advance \
            --plan work/wan-chain-plan.json \
            --output-dir outputs/wan22
