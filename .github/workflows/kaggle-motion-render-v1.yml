# Kaggle motion renderer bridge, v20. Safely identify API credential expiry without revealing secrets. Read-only authentication recovery for existing Kaggle notebook.
name: Kaggle GPU Motion Renderer (v20)
on:
  push:
    branches: [main]
    paths:
      - 'kaggle/renderer/render.py'
      - 'kaggle/renderer/scail2.py'
      - 'scripts/kaggle_motion_bridge.py'
      - '.github/workflows/kaggle-motion-render-v1.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Submit a new Kaggle render or retrieve an existing one
        type: choice
        options: [submit, retrieve]
        default: submit
        required: true
      engine:
        description: Existing VACE or SCAIL-2 Q6_K ComfyUI backend
        type: choice
        options: [vace-1.3b, scail2-q6k]
        default: vace-1.3b
      kaggle_datasets:
        description: Optional semicolon-separated owner/slug identifiers for reusable model datasets
        type: string
        default: ""
      duration_seconds:
        description: SCAIL-2 first clip duration in seconds (1 to 5)
        type: number
        default: 2
      kaggle_username:
        description: Kaggle username for private render jobs (override if different)
        type: string
        default: "jamesnexus"
      image_drive_url:
        description: Google Drive image share URL (Anyone with link - Viewer)
        type: string
        default: ""
      motion_drive_url:
        description: Google Drive motion MP4, animated WebP, or GIF link (Anyone with link - Viewer)
        type: string
        default: ""
      prompt:
        description: Non-confidential animation instructions (public workflow input)
        type: string
        default: ""
      negative_prompt:
        description: Unwanted features (added to built-in anatomy safeguards)
        type: string
        default: ""
      frames:
        description: Requested frames (5–81; automatically rounded to nearest supported 4n+1)
        type: number
        default: 17
      fps:
        description: Playback FPS
        type: number
        default: 8
      source_run_id:
        description: Original GitHub run ID for retrieval
        type: string
        default: ""
      kernel:
        description: Optional exact Kaggle owner/kernel-slug for retrieval
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: kaggle-motion-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  kaggle-bridge:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[kaggle-retry]') || contains(github.event.head_commit.message, '[kaggle-scail]') || contains(github.event.head_commit.message, '[kaggle-monitor]') || contains(github.event.head_commit.message, '[kaggle-salvage')
    name: Kaggle ${{ inputs.operation || 'submit' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      VIDEO_REPO_TOKEN: ${{ secrets.VIDEO_REPO_TOKEN }}
      KG_USER: ${{ inputs.kaggle_username || 'jamesnexus' }}
      KG_ENGINE: ${{ contains(github.event.head_commit.message, '[kaggle-scail]') && 'scail2-q6k' || inputs.engine || 'vace-1.3b' }}
      KG_DATASETS: ${{ inputs.kaggle_datasets || '' }}
      KG_DURATION: ${{ inputs.duration_seconds || 2 }}
      KG_IMAGE_DRIVE: ${{ inputs.image_drive_url || 'https://drive.google.com/file/d/1koBX9M-8FpO10dX2H1OPdL0TY8myu-Sw/view' }}
      KG_MOTION_DRIVE: ${{ inputs.motion_drive_url || 'https://drive.google.com/file/d/1o4z06n0zJ2Mclj_imu1WzLoeW0XE9kvU/view' }}
      KG_PROMPT: ${{ inputs.prompt || 'Animate all three characters following the motion reference as closely as possible. Preserve each character’s unique identity, facial features, hairstyle, clothing, colors, and original anime art style. Maintain their relative positions, proportions, and spatial relationships. Keep the original image framing and crop fixed. If any body parts are currently out of frame or cropped out, keep them out of frame and do not reveal or invent hidden body parts. Preserve the existing composition exactly while animating only the visible portions of the characters. Ensure natural, synchronized movement and consistent anatomy throughout the animation.' }}
      KG_NEGATIVE: ${{ inputs.negative_prompt || 'Reframing, camera movement, panning, zooming, crop changes, revealing off-screen body parts, inventing hidden anatomy, bringing cropped arms, legs, heads, hands, or other missing parts into view, merged characters, fused bodies, swapped faces, identity mixing, overlapping anatomy, duplicated characters, disappearing characters, extra limbs, missing limbs, detached limbs, distorted faces, inconsistent clothing, unnatural motion, incorrect movement, flickering, jitter, perspective changes, transformations, gore, dismemberment.' }}
      KG_FRAMES: ${{ inputs.frames || 25 }}
      KG_FPS: ${{ inputs.fps || 8 }}
      KG_SOURCE_RUN: ${{ inputs.source_run_id }}
      KG_KERNEL: ${{ inputs.kernel }}
      MONITOR_PRIOR: ${{ contains(github.event.head_commit.message, '[kaggle-monitor]') }}
      SALVAGE_PRIOR: ${{ contains(github.event.head_commit.message, '[kaggle-salvage') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install authenticated Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAGGLE_API_TOKEN" || { echo "::error::KAGGLE_API_TOKEN Actions secret is missing"; exit 1; }
          python -m pip install -q --disable-pip-version-check 'kaggle>=2.2.4,<3' 'six>=1.16,<2'
          # Read-only credential classification. Never print or log token bytes,
          # raw JWT claims, HTTP request headers, or developer credentials.
          python - <<'PY'
          import base64, datetime, json, os, time
          token = os.environ.get("KAGGLE_API_TOKEN", "").strip()
          pieces = token.split(".")
          if len(pieces) == 3:
              try:
                  body = pieces[1] + "=" * (-len(pieces[1]) % 4)
                  payload = json.loads(base64.urlsafe_b64decode(body))
                  exp = payload.get("exp")
                  if isinstance(exp, (int, float)):
                      remaining = int(exp - time.time())
                      print("Kaggle secret format: expiring JWT; expired=" +
                            str(remaining <= 0).lower() + "; remaining_minutes=" +
                            str(max(0, remaining // 60)))
                  else:
                      print("Kaggle secret format: JWT without explicit exp")
              except Exception:
                  print("Kaggle secret format: opaque/non-decodable; expiry unverified")
          else:
              print("Kaggle secret format: opaque; expiry unverified")
          PY
          kaggle --version
      - name: Prepare approved GPU render
        if: inputs.operation == 'submit' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[kaggle-retry]') || contains(github.event.head_commit.message, '[kaggle-scail]')))
        shell: bash
        run: |
          set -euo pipefail
          if [ "$KG_ENGINE" = "scail2-q6k" ]; then
            render_steps=6
            render_fps=16
            render_frames=$(( KG_DURATION * 16 + 1 ))
          else
            render_steps=20
            render_fps="$KG_FPS"
            render_frames="$KG_FRAMES"
          fi
          python3 scripts/kaggle_motion_bridge.py prepare \
            --kaggle-username "$KG_USER" --run-id "$GITHUB_RUN_ID" \
            --engine "$KG_ENGINE" --kaggle-datasets "$KG_DATASETS" \
            --duration-seconds "$KG_DURATION" \
            --image-drive "$KG_IMAGE_DRIVE" --motion-drive "$KG_MOTION_DRIVE" \
            --prompt "$KG_PROMPT" --negative "$KG_NEGATIVE" \
            --frames "$render_frames" --fps "$render_fps" --steps "$render_steps" \
            --path "$RUNNER_TEMP/kaggle-stage" \
            --receipt "$RUNNER_TEMP/kaggle-receipt-v1.json"
      - name: Submit private dual-T4 Kaggle job
        if: inputs.operation == 'submit' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[kaggle-retry]') || contains(github.event.head_commit.message, '[kaggle-scail]')))
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kaggle_motion_bridge.py submit \
            --path "$RUNNER_TEMP/kaggle-stage" \
            --receipt "$RUNNER_TEMP/kaggle-receipt-v1.json"
          python3 - "$RUNNER_TEMP/kaggle-receipt-v1.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf8"))
          with open(sys.argv[2],"a",encoding="utf8") as f:
              f.write("## Kaggle submitted\n\nKernel: "+r["kernel"]+"\n\n")
              f.write("Submission is not a completed render. Retrieve after Kaggle finishes using this run ID.\n")
          PY
      - name: Preserve submission identity
        if: inputs.operation == 'submit' || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[kaggle-retry]') || contains(github.event.head_commit.message, '[kaggle-scail]')))
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-motion-submission-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/kaggle-receipt-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Monitor Kaggle to verified output and archive
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[kaggle-salvage')
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MONITOR_PRIOR" = "true" ]; then
            source_id="41587220856"
          else
            source_id="$GITHUB_RUN_ID"
          fi
          python3 scripts/kaggle_motion_bridge.py monitor \
            --kaggle-username "$KG_USER" --source-run-id "$source_id" \
            --output "$RUNNER_TEMP/kaggle-result" --timeout-seconds 4200
          echo "Kaggle returned validated render assets for $source_id" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/archive_gallery.py \
            --run-id "$GITHUB_RUN_ID" --kind kaggle \
            --source "$RUNNER_TEMP/kaggle-result"
      - name: Recover all available media from failed Kaggle job
        if: always() && github.event_name == 'push' && (contains(github.event.head_commit.message, '[kaggle-salvage') || failure())
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SALVAGE_PRIOR" = "true" ]; then
            source_id=$(git log -1 --format=%s | sed -n 's/.*\[kaggle-salvage:\([0-9][0-9]*\)\].*/\1/p')
            if [ -z "$source_id" ]; then
              source_id="41589905361"
            elif ! [[ "$source_id" =~ ^[0-9]{4,24}$ ]]; then
              echo "::error::Invalid source run ID in salvage trigger"
              exit 1
            fi
          elif [ "$MONITOR_PRIOR" = "true" ]; then
            source_id="41587220856"
          else
            source_id="$GITHUB_RUN_ID"
          fi
          python3 scripts/kaggle_motion_bridge.py salvage \
            --kaggle-username "$KG_USER" --source-run-id "$source_id" \
            --output "$RUNNER_TEMP/kaggle-salvage"
          while IFS= read -r -d '' diagnosis; do
            echo "===== SALVAGED DIAGNOSIS: $(basename "$diagnosis") ====="
            tail -c 14000 "$diagnosis"
          done < <(find "$RUNNER_TEMP/kaggle-salvage" -type f \( \
            -name 'failure-inner-v1.json' -o -name 'scail-install-v1.log' \
            -o -name 'comfyui-v1.log' -o -name 'scail-inference-v1.log' \
            -o -name 'scail-initial-storage-v1.json' -o -name 'scail-preflight-v1.json' \
          \) -print0)
          python3 scripts/archive_gallery.py \
            --run-id "$GITHUB_RUN_ID" --kind kaggle \
            --source "$RUNNER_TEMP/kaggle-salvage"
          echo "Salvaged failed kernel $source_id; NOT approved for chaining" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect and verify actual Kaggle video
        if: inputs.operation == 'retrieve'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/kaggle_motion_bridge.py collect \
            --kaggle-username "$KG_USER" \
            --source-run-id "$KG_SOURCE_RUN" --kernel "$KG_KERNEL" \
            --output "$RUNNER_TEMP/kaggle-result"
          echo "Downloaded Kaggle video and SHA-verified it. Human review still required." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve non-media result receipt
        if: inputs.operation == 'retrieve'
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-motion-receipt-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/kaggle-result/bridge-result-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Permanently archive verified output in existing gallery
        if: inputs.operation == 'retrieve'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/archive_gallery.py \
            --run-id "$GITHUB_RUN_ID" --kind kaggle \
            --source "$RUNNER_TEMP/kaggle-result"
