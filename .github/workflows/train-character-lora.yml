# Prepare and accept results from a future distributed CPU training network (v2).
# No self-hosted GPU, no local CUDA, no claim that training already occurred.
name: Prepare or finalize distributed CPU character LoRA (v2)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Prepare distributed CPU training request or verify finalized weights"
        type: choice
        required: true
        default: prepare
        options:
          - prepare
          - finalize
      character_id:
        description: "Saved character ID with at least three distinct image references"
        type: string
        required: true
      hf_model_repo:
        description: "Private Hugging Face model destination: namespace/model-name"
        type: string
        required: true
      training_steps:
        description: "CPU training target steps, 100-1200 (prepare only)"
        type: number
        required: true
        default: 300
      resolution:
        description: "Training square image size: 256/384/512/640/768"
        type: number
        required: true
        default: 512
      lora_rank:
        description: "Low-rank adapter size, 4-32"
        type: number
        required: true
        default: 8
      workers:
        description: "Requested independent CPU training workers, 2-20"
        type: number
        required: true
        default: 4
      request_id:
        description: "For finalize, enter the earlier lora-<run-id>; blank for prepare"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: anime-library-writes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  request-or-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      OPERATION: ${{ inputs.operation }}
      CHARACTER_ID: ${{ inputs.character_id }}
      HF_MODEL_REPO: ${{ inputs.hf_model_repo }}
      TRAINING_STEPS: ${{ inputs.training_steps }}
      RESOLUTION: ${{ inputs.resolution }}
      LORA_RANK: ${{ inputs.lora_rank }}
      WORKERS: ${{ inputs.workers }}
      INPUT_REQUEST_ID: ${{ inputs.request_id }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout canonical character library and training requests
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare frozen dataset request or verify returned model
        shell: bash
        run: |
          set -euo pipefail
          request_id="$INPUT_REQUEST_ID"
          if [[ "$OPERATION" == prepare ]]; then
            if [[ -n "$request_id" ]]; then
              echo "::error::Leave request_id blank when preparing a new request."
              exit 1
            fi
            request_id="lora-${GITHUB_RUN_ID}"
          elif [[ "$OPERATION" == finalize ]]; then
            if [[ -z "$request_id" ]]; then
              echo "::error::Finalize requires the original prepared request ID."
              exit 1
            fi
            python3 -m pip install --no-cache-dir 'huggingface-hub==0.36.0'
          else
            echo "::error::Unsupported training operation."
            exit 1
          fi
          python3 scripts/distributed_lora.py \
            --operation "$OPERATION" \
            --character-id "$CHARACTER_ID" \
            --hf-repo "$HF_MODEL_REPO" \
            --request-id "$request_id" \
            --training-steps "$TRAINING_STEPS" \
            --resolution "$RESOLUTION" \
            --lora-rank "$LORA_RANK" \
            --workers "$WORKERS"
          {
            echo "### Distributed CPU LoRA — $OPERATION"
            echo ""
            echo "- Character: $CHARACTER_ID"
            echo "- Request ID: $request_id"
            if [[ "$OPERATION" == prepare ]]; then
              echo "- Status: REQUEST PREPARED; TRAINING NOT STARTED."
              echo "- Coordinator must consume training/requests/$request_id.json."
              echo "- Finalize only after verified external trainer upload."
            else
              echo "- Status: private Hugging Face LoRA verified and registered."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit request or verified result to canonical repository
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == prepare ]]; then
            git add -- training/requests
          else
            git add -- training/receipts assets/characters
          fi
          if git diff --cached --quiet; then
            echo "No new training metadata to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Distributed character LoRA v2: $OPERATION $CHARACTER_ID"
          git push origin "HEAD:${GITHUB_REF_NAME}"
