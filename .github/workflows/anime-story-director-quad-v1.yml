# Four concurrent CPU workers, one model per draft; v1. Not a training workflow.
name: Anime Story Director four-runner AI (v7)
on:
  workflow_dispatch:
    inputs:
      model:
        description: Select Story Director model
        type: choice
        required: true
        default: muse-glimmer-30b
        options:
          - muse-glimmer-30b
          - qwen3.8-27b
          - qwen3.6-35b-a3b
      story_text:
        description: Non-confidential story outline only (public repository)
        type: string
        default: ""
      story_file:
        description: Optional already checked-in stories/... file
        type: string
        default: ""
      stage:
        description: "Plan the episode outline or detail one scene's clips"
        type: choice
        required: true
        default: episode
        options:
          - episode
          - scene
      scenes:
        description: "Optional preferred scene count; 0 = let director decide (no maximum)"
        type: number
        default: 0
      episode_run:
        description: "For scene: GitHub run ID containing the episode outline draft"
        type: string
        default: ""
      scene_index:
        description: "For scene: ordinal scene number in the episode outline"
        type: number
        default: 1
      resume_run:
        description: "Optional prior same-stage partial draft run ID to continue"
        type: string
        default: ""
      frames:
        description: Fixed Wan frames for each shot
        type: number
        default: 42
      fps:
        description: Fixed Wan FPS for each shot
        type: number
        default: 4
      style:
        description: Character continuity and cinematographic style
        type: string
        default: cinematic anime with consistent character identity
      character_ids:
        description: Character IDs in the existing anime library
        type: string
        default: ""
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: story-director-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  distributed-inference:
    name: Story Director node ${{ matrix.rank }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: true
      matrix:
        rank: [0, 1, 2, 3]
    env:
      PYTHONUNBUFFERED: "1"
      LLAMA_COMMIT: 4c1a0af40d88c7fbb3b15c85bf2e8016d1d5b64c
      STORY_MODEL: ${{ inputs.model }}
      GGML_RPC_NO_RDMA: "1"
    steps:
      - name: Checkout Story Director and models registry
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11 for reproducible inference utilities
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU build and transfer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build libcurl4-openssl-dev jq curl
          python3 --version

      - name: Restore pinned CPU llama.cpp RPC build
        id: engine_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/story-llama-src
            ${{ runner.temp }}/story-llama-build
          key: story-director-llama-b10430-cpu-rpc-ubuntu24-v1

      - name: Build pinned llama.cpp with CPU RPC enabled
        if: steps.engine_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/story-llama-src"
          git -C "$RUNNER_TEMP/story-llama-src" fetch --quiet --depth=1 origin "$LLAMA_COMMIT"
          git -C "$RUNNER_TEMP/story-llama-src" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/story-llama-src" rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -S "$RUNNER_TEMP/story-llama-src" -B "$RUNNER_TEMP/story-llama-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_RPC=ON -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DLLAMA_BUILD_TESTS=OFF -DGGML_NATIVE=OFF
          cmake --build "$RUNNER_TEMP/story-llama-build" --parallel 4 --target llama-server ggml-rpc-server

      - name: Join private Tailscale with GitHub OIDC
        shell: bash
        env:
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TAILNET_TAG: tag:ai-training
        run: |
          set -euo pipefail
          test -n "$TS_CLIENT_ID" || { echo "::error::Set TS_OAUTH_CLIENT_ID in anime-generator and authorize its GitHub OIDC repo in your tailnet policy"; exit 1; }
          bash scripts/story-director/join-tailnet-v1.sh

      - name: Start three private remote CPU inference services
        if: matrix.rank != 0
        shell: bash
        env:
          RPC_RANK: ${{ matrix.rank }}
        run: |
          set -euo pipefail
          ip="$(tailscale ip -4 | head -n 1)"
          [[ "$ip" =~ ^100\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          nohup "$RUNNER_TEMP/story-llama-build/bin/ggml-rpc-server" --host "$ip" --port 50052 > "$RUNNER_TEMP/story-rpc-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/story-rpc-server.pid"
          sleep 3
          kill -0 "$(cat "$RUNNER_TEMP/story-rpc-server.pid")" || { tail -n 80 "$RUNNER_TEMP/story-rpc-server.log"; exit 1; }
          python3 scripts/story-director/rendezvous-v1.py announce --rank "$RPC_RANK" --address "$ip" --model "$STORY_MODEL" --run-id "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/rpc-peer/rendezvous.json"

      - name: Publish exact private RPC peer receipt
        if: matrix.rank != 0
        uses: actions/upload-artifact@v4
        with:
          name: story-director-rpc-v1-${{ github.run_id }}-rank-${{ matrix.rank }}
          path: ${{ runner.temp }}/rpc-peer/rendezvous.json
          if-no-files-found: error
          retention-days: 1

      - name: Maintain private CPU workers until coordinator completes
        if: matrix.rank != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/story-director/rendezvous-v1.py monitor --run-id "$GITHUB_RUN_ID"

      - name: Retrieve three matching private RPC peers
        if: matrix.rank == 0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/story-director/rendezvous-v1.py collect --run-id "$GITHUB_RUN_ID" --model "$STORY_MODEL" --destination "$RUNNER_TEMP/story-rendezvous" --output "$RUNNER_TEMP/story-rpc-addresses.txt"
          IFS=, read -ra peers < "$RUNNER_TEMP/story-rpc-addresses.txt"
          test "${#peers[@]}" -eq 3
          for peer in "${peers[@]}"; do
            tailscale ping --c=1 --timeout=10s "${peer%:*}" >/dev/null || { echo "::error::Remote RPC node disconnected"; exit 1; }
          done

      - name: Recover exact previous episode or stage checkpoint
        if: matrix.rank == 0 && (inputs.stage == 'scene' || inputs.resume_run != '')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ inputs.stage }}
          EPISODE_RUN: ${{ inputs.episode_run }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          set -euo pipefail
          if [ "$STAGE" = scene ]; then
            [[ "$EPISODE_RUN" =~ ^[0-9]{4,24}$ ]] || { echo "::error::For scene details, provide the source episode outline run ID"; exit 1; }
            mkdir -p "$RUNNER_TEMP/story-episode"
            gh run download "$EPISODE_RUN" -R "$GITHUB_REPOSITORY" \
              --name "anime-story-director-draft-v1-$EPISODE_RUN" \
              --dir "$RUNNER_TEMP/story-episode"
            test -s "$RUNNER_TEMP/story-episode/story-draft-v1.json"
            test -s "$RUNNER_TEMP/story-episode/source-plan.json"
          fi
          if [ -n "$RESUME_RUN" ]; then
            [[ "$RESUME_RUN" =~ ^[0-9]{4,24}$ ]] || { echo "::error::Invalid resume run ID"; exit 1; }
            mkdir -p "$RUNNER_TEMP/story-resume"
            gh run download "$RESUME_RUN" -R "$GITHUB_REPOSITORY" \
              --name "anime-story-director-draft-v1-$RESUME_RUN" \
              --dir "$RUNNER_TEMP/story-resume"
            test -s "$RUNNER_TEMP/story-resume/story-draft-v1.json"
            test -s "$RUNNER_TEMP/story-resume/source-plan.json"
          fi

      - name: Prepare or inherit source-bound episode plan
        if: matrix.rank == 0
        shell: bash
        env:
          DIRECTOR_STORY_TEXT: ${{ inputs.story_text }}
          STORY_FILE: ${{ inputs.story_file }}
          STORY_SCENES: ${{ inputs.scenes }}
          STORY_FRAMES: ${{ inputs.frames }}
          STORY_FPS: ${{ inputs.fps }}
          STORY_STYLE: ${{ inputs.style }}
          STORY_CHARACTERS: ${{ inputs.character_ids }}
          DIRECTOR_STAGE: ${{ inputs.stage }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/story-input"
          if [ "$DIRECTOR_STAGE" = scene ]; then
            cp "$RUNNER_TEMP/story-episode/source-plan.json" "$RUNNER_TEMP/story-input/source-plan.json"
          elif [ -n "$RESUME_RUN" ]; then
            cp "$RUNNER_TEMP/story-resume/source-plan.json" "$RUNNER_TEMP/story-input/source-plan.json"
          else
            python3 scripts/story-director/director-v1.py prepare \
              --model "$STORY_MODEL" --story-file "$STORY_FILE" --scenes "$STORY_SCENES" \
              --frames "$STORY_FRAMES" --fps "$STORY_FPS" \
              --style "$STORY_STYLE" --characters "$STORY_CHARACTERS" \
              --output "$RUNNER_TEMP/story-input/source-plan.json"
          fi

      - name: Reclaim disposable SDKs on model-loading coordinator
        if: matrix.rank == 0
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h "$RUNNER_TEMP"

      - name: Download and SHA-verify selected pinned GGUF model
        if: matrix.rank == 0
        run: |
          python3 scripts/story-director/director-v1.py download --model "$STORY_MODEL" --destination "$RUNNER_TEMP/story-model"

      - name: Mount pinned GGUF over read-only HTTPS Range when SSD is too small
        if: matrix.rank == 0
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/story-model/remote-manifest-v1.json"
          if [ ! -f "$manifest" ]; then
            echo "Verified GGUF fits on controller local SSD; no FUSE mount needed"
            exit 0
          fi
          test -e /dev/fuse || { echo "::error::Runner has no /dev/fuse; Q4 model exceeds local SSD and requires a remote GGUF mount"; exit 1; }
          sudo apt-get install -y -qq libfuse2t64 fuse3
          python3 -m pip install --user 'mfusepy>=1.1,<2'
          mountpoint_dir="$RUNNER_TEMP/story-model/mounted"
          mkdir -p "$mountpoint_dir"
          nohup python3 scripts/story-director/remote-gguf-v1.py \
            --manifest "$manifest" --mountpoint "$mountpoint_dir" \
            --provenance "$RUNNER_TEMP/story-model/model-provenance-v1.json" \
            > "$RUNNER_TEMP/story-fuse.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/story-fuse.pid"
          mounted=0
          for n in $(seq 1 60); do
            if mountpoint -q "$mountpoint_dir"; then mounted=1; break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/story-fuse.pid")" 2>/dev/null; then
              tail -n 50 "$RUNNER_TEMP/story-fuse.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$mounted" != 1 ]; then
            tail -n 50 "$RUNNER_TEMP/story-fuse.log"
            echo "::error::Could not mount pinned GGUF remote range filesystem"
            exit 1
          fi
          filename="$(jq -r '.filename' "$manifest")"
          test -r "$mountpoint_dir/$filename"
          echo "Pinned remote GGUF visible without occupying local SSD"

      - name: Start isolated four-device llama.cpp RPC inference
        if: matrix.rank == 0
        shell: bash
        run: |
          set -euo pipefail
          model="$(find "$RUNNER_TEMP/story-model" -maxdepth 2 -name '*.gguf' -type f -print -quit)"
          test -n "$model"
          rpc="$(cat "$RUNNER_TEMP/story-rpc-addresses.txt")"
          "$RUNNER_TEMP/story-llama-build/bin/llama-server" --model "$model" --alias "$STORY_MODEL" --rpc "$rpc" --n-gpu-layers 99 --ctx-size 16384 --threads 4 --parallel 1 --host 127.0.0.1 --port 8080 > "$RUNNER_TEMP/story-llama-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/story-llama-server.pid"
          ready=0
          for i in $(seq 1 240); do
            if curl -fsS --max-time 5 http://127.0.0.1:8080/health | jq -e '.status == "ok"' >/dev/null 2>&1; then ready=1; break; fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/story-llama-server.pid")" 2>/dev/null; then tail -n 60 "$RUNNER_TEMP/story-llama-server.log"; exit 1; fi
            sleep 5
          done
          if [ "$ready" != 1 ]; then echo "::error::Distributed llama.cpp failed to become ready"; tail -n 60 "$RUNNER_TEMP/story-llama-server.log"; exit 1; fi

      - name: Generate episode outline or per-scene clip draft on four runners
        if: matrix.rank == 0
        shell: bash
        env:
          DIRECTOR_STAGE: ${{ inputs.stage }}
          DIRECTOR_SCENE_INDEX: ${{ inputs.scene_index }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/story-output"
          args=(--model "$STORY_MODEL" --stage "$DIRECTOR_STAGE" \
            --plan "$RUNNER_TEMP/story-input/source-plan.json" \
            --provenance "$RUNNER_TEMP/story-model/model-provenance-v1.json" \
            --output "$RUNNER_TEMP/story-output/story-draft-v1.json")
          if [ "$DIRECTOR_STAGE" = scene ]; then
            args+=(--scene-index "$DIRECTOR_SCENE_INDEX" \
                   --outline "$RUNNER_TEMP/story-episode/story-draft-v1.json")
          fi
          if [ -n "$RESUME_RUN" ]; then
            args+=(--resume-draft "$RUNNER_TEMP/story-resume/story-draft-v1.json")
          fi
          python3 scripts/story-director/director-v1.py infer "${args[@]}"

      - name: Upload draft, not an approved production plan
        if: matrix.rank == 0
        uses: actions/upload-artifact@v4
        with:
          name: anime-story-director-draft-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/story-output/story-draft-v1.json
            ${{ runner.temp }}/story-input/source-plan.json
          if-no-files-found: error
          retention-days: 14

      - name: Preserve episode and scene drafts permanently in private gallery
        if: matrix.rank == 0
        env:
          VIDEO_REPO_TOKEN: ${{ secrets.VIDEO_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/story-archive"
          cp "$RUNNER_TEMP/story-output/story-draft-v1.json" "$RUNNER_TEMP/story-archive/story-draft-v1.json"
          cp "$RUNNER_TEMP/story-input/source-plan.json" "$RUNNER_TEMP/story-archive/source-plan.json"
          python3 scripts/archive_gallery.py \
            --run-id "$GITHUB_RUN_ID" --kind story-director \
            --source "$RUNNER_TEMP/story-archive"

      - name: Summarize disposition
        if: matrix.rank == 0
        shell: bash
        run: |
          echo "Story Director episode/scene draft generated. Unlimited creative scene/clip counts are processed in bounded, resumable inference batches; no Wan rendering dispatched." >> "$GITHUB_STEP_SUMMARY"
          echo "Source/model digests are included in the saved draft receipt." >> "$GITHUB_STEP_SUMMARY"
